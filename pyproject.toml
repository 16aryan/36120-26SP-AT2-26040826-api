[project]
name = "weather-intel-api"
version = "1.0.0"
description = "FastAPI deployment repo for AT2 - Weather Intelligence ML services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pydantic>=2.6",
    "requests>=2.31",
    "nba-prep-26040826>=0.4.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
