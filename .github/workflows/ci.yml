name: FastAPI CI & Endpoint Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test & Verify Endpoints
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "nba-prep-26040826>=0.4.0"

    - name: Run Pytest Test Suite
      run: |
        mkdir -p reports
        pytest tests/ -v --junitxml=reports/junit_report.xml

    - name: Run Interactive Verification Script
      run: |
        python verify_api.py

    - name: Upload Verification & Test Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: api-artifacts-python-${{ matrix.python-version }}
        path: |
          reports/
          api_verification_results.json
          api_verification_summary.md
          api_verification_dashboard.png
        retention-days: 14
