name: FastAPI CI & Endpoint Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test & Verify Endpoints
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "nba-prep-26040826>=0.4.0"

    - name: Run Pytest Test Suite
      run: |
        pytest tests/ -v

    - name: Run Interactive Verification Script
      run: |
        python verify_api.py
